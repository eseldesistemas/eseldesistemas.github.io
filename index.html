const categories=['Todas','Diseño y CAD','Multimedia','Navegadores','Ofimática','Utilidades'];
let category='Todas', query='', onlyFav=false, view='list';
let openCategories=new Set();
let favorites=[]; try { favorites=JSON.parse(localStorage.getItem('eds-favorites') || '["googlechrome","7zip","autocad"]'); } catch(e) { favorites=['googlechrome','7zip','autocad']; }
const $=id=>document.getElementById(id);
function saveFav(){ try { localStorage.setItem('eds-favorites', JSON.stringify(favorites)); } catch(e) {} }
function fillSelect(id, values, current, firstLabel){
  const sel=$(id); sel.replaceChildren();
  values.forEach(v=>{ const op=document.createElement('option'); op.value=v; op.textContent=v==='Todas'?firstLabel:v; sel.appendChild(op); });
  sel.value=current;
}
function icon(app){
  const span=document.createElement('span'); span.className='appicon';
  if(app.logo){
    const img=document.createElement('img'); img.alt='';
    img.src='https://cdn.jsdelivr.net/npm/simple-icons@v14/icons/'+encodeURIComponent(app.logo)+'.svg';
    img.onerror=()=>{ span.classList.add('fallback'); span.textContent=app.name[0]; };
    span.appendChild(img);
  } else { span.classList.add('fallback'); span.textContent=app.name[0]; }
  return span;
}
function downloadFile(url){if(url&&/^https:\/\//.test(url))window.open(url,'_blank','noopener,noreferrer');}
function download(app){const d=app.downloads?.find(x=>x.kind==='Completo')||app.downloads?.[0];if(d)downloadFile(d.url);}
function buttonIcon(kind){
 const paths={
 cloud:'<path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"/>',
 download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',
 window:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/>',
 disk:'<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 12h20"/><path d="M10 15.5h.01M14 15.5h.01"/>'
 };
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');
 svg.innerHTML=paths[kind];return svg;
}
function makeCard(app){
 const item=document.createElement('article');item.className='rowapp browseapp';
 const info=document.createElement('div');info.className='info';
 const title=document.createElement('div');title.className='name';title.textContent=app.name;
 const summary=document.createElement('span');summary.className='app-summary';summary.textContent=app.description||'';
 info.append(title,summary);
 const fav=document.createElement('button');fav.className='fav'+(favorites.includes(app.id)?' on':'');fav.textContent=favorites.includes(app.id)?'★':'☆';fav.title='Favorito';fav.setAttribute('aria-label','Favorito '+app.name);fav.onclick=e=>{e.stopPropagation();favorites=favorites.includes(app.id)?favorites.filter(x=>x!==app.id):[...favorites,app.id];saveFav();render()};
 const downloadBox=document.createElement('div');downloadBox.className='download-options';
 const choices=app.downloads||[];
 for(const d of choices){const btn=document.createElement('button');btn.className='download';btn.replaceChildren(buttonIcon(d.kind==='Online'?'cloud':'download'));btn.setAttribute('aria-label',d.kind==='Online'?'Descargar instalador online':'Descargar instalador completo');btn.title=d.kind==='Online'?'Descargar instalador liviano':'Descargar instalador completo';btn.onclick=e=>{e.stopPropagation();downloadFile(d.url)};downloadBox.append(btn)}
 for(const link of app.privateLinks||[]){const personal=document.createElement('button');personal.className='private-disk';personal.replaceChildren(buttonIcon('disk'));personal.title='Archivo personal · '+link.source;personal.setAttribute('aria-label','Abrir archivo personal de '+app.name+' en '+link.source);personal.onclick=e=>{e.stopPropagation();window.open(link.url,'_blank','noopener,noreferrer')};downloadBox.append(personal)}
 if(app.website){const web=document.createElement('button');web.className='official-web';web.replaceChildren(buttonIcon('window'));web.title='Abrir sitio oficial';web.setAttribute('aria-label','Abrir sitio oficial de '+app.name);web.onclick=e=>{e.stopPropagation();window.open(app.website,'_blank','noopener,noreferrer')};downloadBox.append(web)}
 if(!choices.length&&!app.website&&!(app.privateLinks?.length)){const pending=document.createElement('span');pending.className='pending';pending.textContent='Pendiente';downloadBox.append(pending)}
 item.append(fav,info,indicators(app),downloadBox);return item;
}
function reset(){ category='Todas'; query=''; onlyFav=false; openCategories.clear(); $('search').value=''; render(); }
function lineIcon(kind){
const paths={
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>',
check:'<path d="m4 12 4 4 7-8M13 16l7-8"/>',
key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3M14 9l3 3"/>',
file:'<path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/>',
tools:'<path d="m4 20 9-9M12 5a6 6 0 0 0 7 7l-6 6-7-7 6-6zM4 20l3-3"/>',
media:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="m3 10 18 0M8 5l-3 5m9-5-3 5m5 4 4 2-4 2z"/>',
cad:'<path d="M4 20h16L12 4zM9 16h6M12 12v4"/>',
folder:'<path d="M3 7h7l2 3h9v10H3zM3 7V5h7l2 2"/>'
};
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');svg.innerHTML=paths[kind]||paths.folder;return svg;
}
function categoryIcon(c){return ({'Navegadores':'globe','Ofimática':'file','Utilidades':'tools','Multimedia':'media','Diseño y CAD':'cad'})[c]||'folder'}
function indicators(app){
 const el=document.createElement('span');el.className='indicators';
 const tags=[];
 if(app.downloads?.length)tags.push(['globe','Enlace oficial']);
 // No inferir estados de activación ni licencias sin datos confirmados en el catálogo.
 if(app.licenseType==='preactivated')tags.push(['check','Preactivado']);
 if(app.licenseType==='alternative')tags.push(['key','Licencia alternativa']);
 tags.forEach(([kind,label])=>{const icon=lineIcon(kind);icon.setAttribute('title',label);icon.setAttribute('aria-label',label);el.appendChild(icon)});
 return el;
}
function render(){
  $('resetSearch').classList.toggle('hidden', !query);
  $('favs').classList.toggle('active', onlyFav);
  const side=$('sidecategories'); side.replaceChildren();
  categories.forEach(c=>{
    const b=document.createElement('button');b.className='sidebutton'+(category===c?' active':'');
    b.textContent=c==='Todas'?'◈  Todas las categorías':'▸  '+c;
    b.onclick=()=>{category=c;onlyFav=false;if(c!=='Todas')openCategories.add(c);render();if(c!=='Todas')document.getElementById('group-'+categories.indexOf(c))?.scrollIntoView({behavior:'smooth',block:'start'});};
    side.appendChild(b);
  });
  const filtered=apps.filter(a=>(category==='Todas'||a.category===category)&&(!onlyFav||favorites.includes(a.id))&&(a.name+' '+a.manufacturer+' '+a.category).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name,'es',{sensitivity:'base',numeric:true})||a.version.localeCompare(b.version,'es',{sensitivity:'base',numeric:true}));
  const results=$('results');results.className='grouped';results.replaceChildren();
  categories.filter(c=>c!=='Todas'&&(category==='Todas'||category===c)).forEach(c=>{
    const group=document.createElement('section');group.className='categorygroup';group.id='group-'+categories.indexOf(c);
    const head=document.createElement('button');head.type='button';head.className='categoryhead';
    const isOpen=query.trim().length>0||category!=='Todas'||openCategories.has(c);
    head.setAttribute('aria-expanded',String(isOpen));
    const body=document.createElement('div');body.className='categorybody '+(view==='list'?'list':'tiles');body.hidden=!isOpen;
    const badge=document.createElement('span');badge.className='categorybadge';badge.appendChild(lineIcon(categoryIcon(c)));
    const name=document.createElement('span');name.textContent=c;
    const count=document.createElement('span');count.className='categorycount';const quantity=filtered.filter(a=>a.category===c).length;count.textContent=quantity ? quantity+' programas' : '';
    const arrow=document.createElement('span');arrow.className='categorychevron';arrow.textContent='⌄';
    head.append(badge,name,count,arrow);
    head.onclick=()=>{const show=head.getAttribute('aria-expanded')!=='true';head.setAttribute('aria-expanded',String(show));body.hidden=!show;if(show)openCategories.add(c);else openCategories.delete(c);};
    filtered.filter(a=>a.category===c).forEach(a=>body.appendChild(makeCard(a)));
    if(!body.childElementCount){const empty=document.createElement('div');empty.className='empty';empty.textContent='Sin programas cargados';body.appendChild(empty)}
    group.append(head,body);results.append(group);
  });
}
$('search').addEventListener('input', e=>{ query=e.target.value; render(); });
$('resetSearch').addEventListener('click', ()=>{ query=''; $('search').value=''; render(); });
$('favs').addEventListener('click', ()=>{ onlyFav=!onlyFav; render(); });
render();
</script>
<button id="logoutSecure" type="button" aria-label="Cerrar sesión" style="position:fixed;right:14px;bottom:14px;z-index:999;background:#292e35;color:#f6b821;border:1px solid #777;border-radius:10px;padding:10px 13px;cursor:pointer;font:600 12px system-ui">Cerrar sesión</button>
<script>
(() => {
 const IDLE_MS=5*60*1000;
 const RENEW_INTERVAL_MS=45000;
 let lastActivity=Date.now(),lastRenewal=Date.now(),idleTimer,refreshing=false,leaving=false;
 async function logout(){
   if(leaving)return;
   leaving=true;
   try{await fetch('/api/logout',{method:'POST',credentials:'same-origin',cache:'no-store'})}catch{}
   location.replace('/login');
 }
 function schedule(){
   clearTimeout(idleTimer);
   idleTimer=setTimeout(()=>{if(Date.now()-lastActivity>=IDLE_MS)logout();else schedule()},Math.max(250,IDLE_MS-(Date.now()-lastActivity)));
 }
 async function renew(){
   if(refreshing||leaving||Date.now()-lastRenewal<RENEW_INTERVAL_MS)return;
   if(Date.now()-lastActivity>=IDLE_MS){logout();return}
   refreshing=true;
   try{
     const r=await fetch('/api/session',{method:'POST',credentials:'same-origin',cache:'no-store'});
     if(!r.ok){logout();return}
     lastRenewal=Date.now();
   }catch{logout()}
   finally{refreshing=false}
 }
 function activity(){
   if(leaving)return;
   if(Date.now()-lastActivity>=IDLE_MS){logout();return}
   lastActivity=Date.now();schedule();void renew();
 }
 for(const type of ['pointerdown','keydown','wheel','touchstart']){
   document.addEventListener(type,activity,{passive:true});
 }
 document.addEventListener('visibilitychange',()=>{
   if(document.visibilityState==='visible'){
     if(Date.now()-lastActivity>=IDLE_MS)logout();
     else void renew();
   }
 });
 window.addEventListener('pageshow',()=>{
   if(Date.now()-lastActivity>=IDLE_MS)logout();
 });
 document.getElementById('logoutSecure').addEventListener('click',logout);
 schedule();
})();
</script>
</body>
